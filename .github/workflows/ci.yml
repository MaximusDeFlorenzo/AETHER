name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  web-and-api:
    name: Lint, typecheck, build (web + api)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: aether
          POSTGRES_PASSWORD: aether
          POSTGRES_DB: aether
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aether"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://aether:aether@localhost:5432/aether
      REDIS_URL: redis://localhost:6379
      JWT_ACCESS_SECRET: ci-access-secret
      JWT_REFRESH_SECRET: ci-refresh-secret
      AI_ENGINE_URL: http://localhost:8000
      INTERNAL_SERVICE_TOKEN: ci-internal-token
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm run lint

      - run: pnpm run typecheck

      - run: pnpm run build

      - run: pnpm run test

      # Regenerate packages/contracts' generated types from apps/api's live
      # OpenAPI doc (needs postgres/redis above — TypeOrmModule connects on
      # bootstrap) and fail if the committed file is stale — the mechanism
      # that actually "eliminates manual contract drift" rather than just
      # making regeneration possible.
      - run: pnpm run generate

      - run: git diff --exit-code -- packages/contracts/src/generated.ts

  ai-engine:
    name: Test ai-engine (FastAPI)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/ai-engine
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/ai-engine/requirements.txt

      - run: pip install -r requirements.txt

      - run: pytest
