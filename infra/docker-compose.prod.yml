# Production stack for a single small VPS (sized for 1 vCPU / 2 GB RAM).
# apps/web is NOT here — it deploys to Vercel. See docs/DEPLOYMENT.md.
#
#   docker compose -f infra/docker-compose.prod.yml --env-file infra/.env.production up -d --build
#
# Differences from infra/docker-compose.yml (local dev):
# - Only Caddy publishes ports (80/443, automatic HTTPS). Postgres, Redis,
#   MinIO and the AI engine are reachable only on the internal network.
# - Every container has a memory cap so one spike can't OOM the whole box,
#   and Postgres/Redis/Node/BLAS are tuned for that budget.
# - Secrets have no defaults: compose refuses to start if one is missing.
# - Docker logs are rotated (default json-file logging grows forever).
name: aether

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    shm_size: 256mb
    mem_limit: 600m
    logging: *logging
    command:
      - postgres
      - -c
      - shared_buffers=256MB
      - -c
      - effective_cache_size=768MB
      - -c
      - work_mem=4MB
      - -c
      - maintenance_work_mem=64MB
      - -c
      - max_connections=40
      - -c
      - max_parallel_workers_per_gather=1
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB}
    volumes:
      - aether_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    mem_limit: 160m
    logging: *logging
    # noeviction: BullMQ breaks if Redis silently evicts job keys.
    command: ["redis-server", "--maxmemory", "128mb", "--maxmemory-policy", "noeviction"]
    volumes:
      - aether_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    mem_limit: 256m
    logging: *logging
    command: server /data
    environment:
      MINIO_ROOT_USER: ${STORAGE_ACCESS_KEY_ID:?set STORAGE_ACCESS_KEY_ID}
      MINIO_ROOT_PASSWORD: ${STORAGE_SECRET_ACCESS_KEY:?set STORAGE_SECRET_ACCESS_KEY}
    volumes:
      - aether_minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${STORAGE_ACCESS_KEY_ID} ${STORAGE_SECRET_ACCESS_KEY} &&
      mc mb --ignore-existing local/${STORAGE_BUCKET:-aether-media}
      "

  ai-engine:
    build:
      context: ../apps/ai-engine
    restart: unless-stopped
    mem_limit: 700m
    logging: *logging
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "1"]
    environment:
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:?set INTERNAL_SERVICE_TOKEN}
      PORT: 8000
      # 1 vCPU: stop numpy/scipy/sklearn from spawning a thread pool each.
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    mem_limit: 640m
    logging: *logging
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      ai-engine:
        condition: service_started
    # Everything else (adapter keys, intervals, VAPID, GSMaP, ...) comes
    # straight from the env file; `environment` below pins the values that
    # must point at this compose network.
    env_file: .env.production
    environment:
      NODE_ENV: production
      PORT: 4000
      NODE_OPTIONS: --max-old-space-size=480
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379
      AI_ENGINE_URL: http://ai-engine:8000
      # Signed image URLs are handed to browsers, so they must use the
      # public HTTPS media host (Caddy → minio), not http://minio:9000.
      STORAGE_ENDPOINT: https://${MEDIA_DOMAIN:?set MEDIA_DOMAIN}
      STORAGE_FORCE_PATH_STYLE: "true"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    mem_limit: 96m
    logging: *logging
    depends_on:
      - api
      - minio
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      API_DOMAIN: ${API_DOMAIN:?set API_DOMAIN}
      MEDIA_DOMAIN: ${MEDIA_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - aether_caddy_data:/data
      - aether_caddy_config:/config

volumes:
  aether_postgres_data:
  aether_redis_data:
  aether_minio_data:
  aether_caddy_data:
  aether_caddy_config:
